server:
  grpc:
    addr: 0.0.0.0:50055
    timeout: 1s
data:
  database:
    driver: postgres
    source: postgres://postgres:root@postgres:5432/shop_inventory?sslmode=disable&TimeZone=Asia/Shanghai
  redis:
    addr: redis:6379
    password: root
    dial_timeout: 1s
    read_timeout: 0.2s
    write_timeout: 0.2s
mq:
  addr: amqp://root:root@rabbitmq:5672/
trace:
  endpoint: http://jaeger:14268/api/traces
