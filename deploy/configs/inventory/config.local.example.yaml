#   database:
#     source: postgres://postgres:CHANGE_ME@postgres:5432/shop_inventory?sslmode=disable&TimeZone=Asia/Shanghai
#   redis:
#     password: CHANGE_ME
# mq:
#   addr: amqp://CHANGE_ME:CHANGE_ME@rabbitmq:5672/
# trace:
#   endpoint: http://jaeger:14268/api/traces
# consul:
#   address: consul:8500
#   scheme: http
