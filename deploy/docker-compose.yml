name: kratos-shop

services:
  postgres:
    image: postgres:18
    container_name: ks-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: ks-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "root"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "root", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ks-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: root
      RABBITMQ_DEFAULT_PASS: root
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  consul:
    image: hashicorp/consul:1.19.1
    container_name: ks-consul
    command: ["agent", "-dev", "-client=0.0.0.0"]
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.22
    container_name: ks-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: ks-jaeger
    ports:
      - "14268:14268"
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ks-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ks-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    depends_on:
      - alertmanager
      - postgres-exporter
      - redis-exporter

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: ks-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:root@postgres:5432/postgres?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0-alpine
    container_name: ks-redis-exporter
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: root
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ks-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.1.0
    container_name: ks-loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - lokidata:/loki

  promtail:
    image: grafana/promtail:3.1.0
    container_name: ks-promtail
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki

  user:
    build: ../service/user
    container_name: ks-user
    volumes:
      - ./configs/user:/data/conf:ro
    ports:
      - "50051:50051"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9101/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy

  goods:
    build: ../service/goods
    container_name: ks-goods
    volumes:
      - ./configs/goods:/data/conf:ro
    ports:
      - "50052:50052"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9102/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  cart:
    build: ../service/cart
    container_name: ks-cart
    volumes:
      - ./configs/cart:/data/conf:ro
    ports:
      - "50053:50053"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9103/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy

  order:
    build: ../service/order
    container_name: ks-order
    volumes:
      - ./configs/order:/data/conf:ro
    ports:
      - "50054:50054"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9104/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user:
        condition: service_started
      cart:
        condition: service_started
      goods:
        condition: service_started

  inventory:
    build: ../service/inventory
    container_name: ks-inventory
    volumes:
      - ./configs/inventory:/data/conf:ro
    ports:
      - "50055:50055"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9105/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment:
    build: ../service/payment
    container_name: ks-payment
    volumes:
      - ./configs/payment:/data/conf:ro
    ports:
      - "50056:50056"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9106/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  shop:
    build: ../shop
    container_name: ks-shop
    volumes:
      - ./configs/shop:/data/conf:ro
    ports:
      - "8097:8097"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9107/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      consul:
        condition: service_healthy
      user:
        condition: service_started
      goods:
        condition: service_started

  admin:
    build: ../admin
    container_name: ks-admin
    volumes:
      - ./configs/admin:/data/conf:ro
    ports:
      - "9099:9099"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9108/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      consul:
        condition: service_healthy
      user:
        condition: service_started
      goods:
        condition: service_started

  gateway:
    image: traefik:v3.1
    container_name: ks-gateway
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      - shop
      - admin

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  esdata:
  lokidata:
