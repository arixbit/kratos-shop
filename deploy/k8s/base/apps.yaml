apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: kratos-shop
  labels:
    app: user
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
    spec:
      containers:
        - name: user
          image: ghcr.io/arixbit/kratos-shop/user:latest
          imagePullPolicy: IfNotPresent
          args: ["-conf", "/data/conf"]
          ports:
            - containerPort: 50051
              name: grpc
            - containerPort: 9101
              name: metrics
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9101
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9101
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /data/conf
              readOnly: true
            - name: local-config
              mountPath: /data/conf/config.local.yaml
              subPath: config.local.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: user-config
        - name: local-config
          secret:
            secretName: user-local-config
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: kratos-shop
spec:
  selector:
    app: user
  ports:
    - port: 50051
      targetPort: grpc
---
