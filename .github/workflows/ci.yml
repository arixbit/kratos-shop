name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: bitnami/redis:7.4
        env:
          REDIS_PASSWORD: root
          ALLOW_EMPTY_PASSWORD: "no"
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a root ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: Initialize databases
        run: |
          PGHOST=127.0.0.1 PG_CONTAINER=postgres ./scripts/init-db.sh

      - name: Build all services
        run: make build

      - name: Vet all services
        run: make vet

      - name: Test all services
        run: make test
